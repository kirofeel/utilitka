  <!-- macOS icon grid: 824 body centred on 1024, continuous-corner approximation -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bloomT)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bloomB)"/>
  <rect x="254" y="292" width="96" height="440" rx="48" fill="url(#cool)"/>
  <rect x="394" y="532" width="96" height="200" rx="48" fill="url(#cool)"/>
  <rect x="534" y="532" width="96" height="200" rx="48" fill="url(#hot)"/>
  <rect x="674" y="292" width="96" height="440" rx="48" fill="url(#hot)"/>
  <!-- light catching the top of each bar -->
  <rect x="268" y="304" width="68" height="120" rx="34" fill="#FFFFFF" opacity="0.18"/>
  <rect x="688" y="304" width="68" height="120" rx="34" fill="#FFFFFF" opacity="0.18"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
