<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16364A"/>
      <stop offset="0.55" stop-color="#0E2A3A"/>
      <stop offset="1" stop-color="#121C38"/>
    </linearGradient>
    <radialGradient id="bloomT" cx="0.82" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#30E3E3" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#30E3E3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomB" cx="0.15" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#2F7BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2F7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
